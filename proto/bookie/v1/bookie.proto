syntax = "proto3";

package openledger.bookie.v1;

option go_package = "github.com/devotionalist/open-ledger-client-go/internal/bookiepb;bookiepb";

// Bookie is the single-node storage surface for open-ledger.
service Bookie {
  rpc CreateLedger(CreateLedgerRequest) returns (CreateLedgerResponse);
  rpc AddEntry(AddEntryRequest) returns (AddEntryResponse);
  rpc RecoveryAddEntry(RecoveryAddEntryRequest) returns (RecoveryAddEntryResponse);
  rpc ReadEntry(ReadEntryRequest) returns (ReadEntryResponse);
  rpc ReadEntries(ReadEntriesRequest) returns (ReadEntriesResponse);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc FenceLedger(FenceLedgerRequest) returns (FenceLedgerResponse);
  rpc SetExplicitLac(SetExplicitLacRequest) returns (SetExplicitLacResponse);
  rpc ReadLastConfirmed(ReadLastConfirmedRequest) returns (ReadLastConfirmedResponse);
  rpc LastEntryId(LastEntryIdRequest) returns (LastEntryIdResponse);
  rpc IsFenced(IsFencedRequest) returns (IsFencedResponse);
  rpc DeleteLedger(DeleteLedgerRequest) returns (DeleteLedgerResponse);
}

// Structured failure attached as a gRPC Status detail.
message BookieError {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ALREADY_EXISTS = 1;
    KIND_NOT_FOUND = 2;
    KIND_NO_SUCH_ENTRY = 3;
    KIND_CONFLICT = 4;
    KIND_FENCED = 5;
    KIND_UNAUTHORIZED = 6;
    KIND_VERSION_CONFLICT = 7;
    KIND_META_CONFLICT = 8;
    KIND_NOT_ENOUGH_BOOKIES = 9;
    KIND_INVALID_ARGUMENT = 10;
    KIND_INTERNAL = 11;
  }
  Kind kind = 1;
  uint64 ledger_id = 2;
  uint64 entry_id = 3;
  string message = 4;
}

message Entry {
  uint64 ledger_id = 1;
  uint64 entry_id = 2;
  int64 lac = 3;
  bytes payload = 4;
}

message CreateLedgerRequest {
  uint64 ledger_id = 1;
  bytes master_key = 2;
}

message CreateLedgerResponse {}

message AddEntryRequest {
  uint64 ledger_id = 1;
  uint64 entry_id = 2;
  int64 lac = 3;
  bytes payload = 4;
  bytes master_key = 5;
}

message AddEntryResponse {}

message RecoveryAddEntryRequest {
  uint64 ledger_id = 1;
  uint64 entry_id = 2;
  int64 lac = 3;
  bytes payload = 4;
  bytes master_key = 5;
}

message RecoveryAddEntryResponse {}

message ReadEntryRequest {
  uint64 ledger_id = 1;
  uint64 entry_id = 2;
}

message ReadEntryResponse {
  Entry entry = 1;
}

message ReadEntriesRequest {
  uint64 ledger_id = 1;
  uint64 from_entry_id = 2;
  uint32 max = 3;
}

message ReadEntriesResponse {
  repeated Entry entries = 1;
}

message ListEntriesRequest {
  uint64 ledger_id = 1;
}

message ListEntriesResponse {
  repeated uint64 entry_ids = 1;
}

message FenceLedgerRequest {
  uint64 ledger_id = 1;
  bytes master_key = 2;
}

message FenceLedgerResponse {}

message SetExplicitLacRequest {
  uint64 ledger_id = 1;
  int64 lac = 2;
  bytes master_key = 3;
}

message SetExplicitLacResponse {}

message ReadLastConfirmedRequest {
  uint64 ledger_id = 1;
}

message ReadLastConfirmedResponse {
  int64 lac = 1;
}

message LastEntryIdRequest {
  uint64 ledger_id = 1;
}

message LastEntryIdResponse {
  int64 entry_id = 1;
}

message IsFencedRequest {
  uint64 ledger_id = 1;
}

message IsFencedResponse {
  bool fenced = 1;
}

message DeleteLedgerRequest {
  uint64 ledger_id = 1;
}

message DeleteLedgerResponse {}
